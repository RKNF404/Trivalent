function addArg () {
  BWRAP_ARGS+="${1} "
}

addArg " --cap-drop ALL" # if the browser has capabilities, that is very concerning
addArg " --setenv GDK_DISABLE icon-nodes" # avoid issues with glycin

# Various mitigations
if [[ ${BROWSER_SANDBOX_LEVEL} -ge 2 ]]; then
  addArg "--new-session"
  addArg "--unshare-user-try"
  addArg "--unshare-cgroup-try"
  addArg "--unshare-uts"
  if [[ "${USE_WAYLAND}" == "true" ]]; then
    addArg "--unshare-ipc"
  fi
fi
if [[ ${BROWSER_SANDBOX_LEVEL} -ge 99 ]]; then
  addArg "--unshare-all"
fi

# Filesystem
addArg "--ro-bind / /"
addArg "--proc /proc"
addArg "--dev-bind /sys /sys"
addArg "--remount-ro /sys"
addArg "--dev-bind /dev /dev"
addArg "--bind /dev/shm /dev/shm"
addArg "--remount-ro /dev"
addArg "--bind /tmp /tmp"
if [[ -r "/etc/ld.so.preload" ]]; then # if the file doesnt exist, bwrap will error out
  addArg " --ro-bind-try /dev/null /etc/ld.so.preload" # avoid ld preload usage
fi
addArg "--bind ${HOME} ${HOME}"
addArg "--bind ${XDG_RUNTIME_DIR} ${XDG_RUNTIME_DIR}"

# avoid issues with other applications messing with cache
declare -r TMPFS_CACHE_DIR="/tmp/${CHROMIUM_NAME}_cache/"
mkdir -p "$TMPFS_CACHE_DIR"
addArg "--bind ${TMPFS_CACHE_DIR} ${HOME}/.cache"
